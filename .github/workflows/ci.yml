name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests evals && ruff format --check src tests evals
      - name: Agent, tools, guardrails and API tests (scripted model client, no API key)
        run: pytest -q
      - name: Eval set is well-formed (live evals run manually with credentials)
        run: python evals/run_evals.py --dry-run

  # Build, scan, SBOM, smoke-test, sign: delegated to the central DevSecOps pipeline.
  secure-delivery:
    needs: test
    uses: santoshmyakala/devsecops-gitops-pipeline/.github/workflows/secure-container.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    with:
      image-name: agentic-genai-platform
      smoke-command: ./scripts/smoke-test.sh
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
