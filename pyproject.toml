[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opscopilot"
version = "1.0.0"
description = "Platform operations copilot: retrieval-grounded, tool-using Claude agent with guardrails and evals"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["anthropic>=2.8", "httpx>=0.27", "pydantic>=2.7", "fastapi>=0.115", "uvicorn[standard]>=0.30",
                "prometheus-client>=0.20", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
